image_roi_crop:
  ros__parameters:
    # Input
    image_topic: /camera/camera/depth/image_rect_raw
    camera_info_topic: /camera/camera/depth/camera_info

    # Output
    output_image_topic: /camera/camera/depth/image_cropped
    output_camera_info_topic: /camera/camera/depth/camera_info_cropped

    enable_crop: true

    # Crop region — width/height of 0 means "use remaining extent from offset"
    crop:
      x_offset: 260
      y_offset: 190
      width: 485
      height: 245
