# RoboSub mission values for the pool, read by the behavior tree
# (robosub_mission, LoadMissionConfig). Course numbers are measured on site;
# these are starting points. mission_sim.yaml has the same keys for the
# simulator.

# Where the objects are is the prior map's (landmark_server premap.yaml);
# here only how we do the tasks. Search points and transits are offsets
# "x;y;z;yaw_deg" from the prior_<task> frames (x along the course, z the
# depth), so they hold in every pool.

travel_depth: 0.6

gate_depth: 1.0
gate_panel_subtype: GATE_SURVEY_REPAIR
gate_search: "-3.0;0;1.0;0"   # from prior_gate
gate_entrance_frame: gate_survey_repair_entrance
gate_exit_frame: gate_survey_repair_exit

# Slalom: the side of the red pipes we pass on (the same as our half of the
# gate; left / right seen going down the course), per row the gap frame.
# In a gap frame (+X through the row): where to look at the row from, and
# the pass from just before to just behind it. MEASURE the depth: the middle
# of the pipes.
slalom_depth: 1.0
slalom_search: "-4.5;0;0;0"        # from prior_slalom (the middle row)
slalom_frame_0: slalom_right_0
slalom_frame_1: slalom_right_1
slalom_frame_2: slalom_right_2
slalom_view: "-1.4;0;0"
slalom_before: "-0.8;0;0"
slalom_after: "0.7;0;0"
slalom_blind: "2.0;0;0"            # a row that is not found: one row ahead

slalom_bypass_in: "-4.0;-4.0;0.6;0"
slalom_bypass_out: "4.0;-4.0;0.6;0"

torpedo_depth: 1.25
torpedo_search: "-3.0;0;1.25;0"
torpedo_standoff: "-1.5;0;0"
# The openings to shoot (landmark_server <icon>_opening frames) and, per
# tube, where base_link holds to fire: in the opening frame (+X through the
# board), so -x is the distance and y, z take out the tube's offset from
# base_link. MEASURE the tubes.
torpedo_opening_1: torpedo_icon_fire_opening
torpedo_opening_2: torpedo_icon_firetruck_opening
torpedo_aim_left: "-0.6;0;0"
torpedo_aim_right: "-0.6;0;0"

bins_search_depth: 1.0
bins_search: "-2.5;0;1.0;0"
bins_hover: "0;0;-1.0"

octagon_search: "-3.0;0;0.6;0"
octagon_hover: "0;0;-1.0"
surface_depth: 0.2

gate_budget_ms: 120000
torpedo_budget_ms: 180000
bins_budget_ms: 150000
octagon_budget_ms: 150000
return_budget_ms: 240000
