# RoboSub mission values, read by the behavior tree (robosub_mission).
# Start values; course numbers are measured on site. Each task adds its own
# section here when it is written.

run_time_s: 900            # performance time
startup_delay_s: 30
max_depth_m: 2.0
coin_flip_offset_deg: 0    # 0 | 90 | -90 | 180, set before the run
preferred_role: survey_repair   # or search_rescue

# Task values (starting points; course numbers are measured on site).
# Areas are in the course frame (x through the gate, y right).
default_gate_side: right   # used if the gate is passed blind
style_yaw_turns: 0         # 4 = one full turn after the gate

travel_depth: 0.6
gate_depth: 1.0
slalom_depth: 1.5          # between the pipe ends
bins_search_depth: 1.0
torpedo_depth: 1.25
octagon_search_depth: 0.9
fire_distance_m: 0.5       # from the launcher; bonus from 0.46 m

bins_area_x: 12.0
bins_area_y: 2.0
torpedo_area_x: 15.0
torpedo_area_y: -5.0
octagon_area_x: 20.0
octagon_area_y: 0.0
octagon_items_enabled: false   # table items, a stretch goal
