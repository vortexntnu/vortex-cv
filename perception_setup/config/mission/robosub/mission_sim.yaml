# Mission values for the Stonefish course. Same keys as mission.yaml.
# Offsets are "x;y;z;yaw_deg" from the frame they are used with. For the
# prior_<task> frames x is along the course and z is relative to the task's
# depth.

travel_depth: 1.5

gate_depth: 2.7
gate_panel_subtype: GATE_SEARCH_RESCUE
gate_search: "-3.0;0;0.4;0"
gate_entrance_frame: gate_search_rescue_entrance
gate_exit_frame: gate_search_rescue_exit

# Pass on the same side of the red pipes as our half of the gate.
slalom_depth: 2.6
slalom_search: "-4.5;0;0;0"
slalom_frame_0: slalom_right_0
slalom_frame_1: slalom_right_1
slalom_frame_2: slalom_right_2
slalom_view: "-1.0;0;0"     # line up here, in front of the gap
slalom_after: "1.0;0;0"     # the pass ends here
slalom_blind: "2.0;0;0"     # used when a row is not found

# Around the slalom, from prior_slalom.
slalom_bypass_in: "-4.0;-4.0;-1.1;0"
slalom_bypass_out: "4.0;-4.0;-1.1;0"

torpedo_depth: 2.5
torpedo_search: "-3.0;0;0;0"
torpedo_standoff: "-1.5;0;0"
# Which two openings are ours depends on the board version. These are the
# Search & Rescue pair on version 1.
torpedo_opening_1: torpedo_opening_large_left
torpedo_opening_2: torpedo_opening_small_top
# Where base_link holds to fire, in the opening frame. TODO: measure the tubes.
torpedo_aim_left: "-0.6;0;0"
torpedo_aim_right: "-0.6;0;0"

bins_search_depth: 1.8
bins_search: "-2.5;0;-1.35;0"
bins_hover: "0;0;-1.3"

octagon_search: "-3.0;0;1.5;0"
octagon_hover: "0;0;-1.2"
surface_depth: 0.3

# Time per task [ms]. A task that runs out is skipped.
gate_budget_ms: 360000
torpedo_budget_ms: 600000
bins_budget_ms: 420000
octagon_budget_ms: 480000
return_budget_ms: 720000
