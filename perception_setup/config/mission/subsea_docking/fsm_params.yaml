/**:
  ros__parameters:
    # ── Timing ────────────────────────────────────────────────────────────────
    camera_direction_timeout_sec: 30.0      # total bearing collection window (s)
    wall_detection_estimate_timeout_sec: 20.0
    wait_before_fallback_sec: 5.0

    # ── Bearing direction server ───────────────────────────────────────────────
    bearing_direction_action_server: platform_bearing_direction
    bearing_direction_distance: 20.0         # metres to project waypoint along avg bearing
    bearing_direction_min_measurements: 10   # fail if fewer than this collected at timeout
    bearing_direction_max_measurements: 30   # early-exit when this many collected (0 = disabled)
