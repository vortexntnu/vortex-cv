slalom_pole_finder:
  ros__parameters:
    detections_topic: "/yolo_object_detection/detections"
    positions_topic: "/slalom_pole_finder/poles_3d"
    # LandmarkArray containing the tracked pole positions and IDs.
    landmarks_topic: "/nautilus/landmarks"
    # Reject boxes this close to the top, bottom, left, or right image edge.
    edge_margin_px: 30.0
    image_width: 1920
    image_height: 1080
    # Maximum 3D distance for reusing a pole ID across frames.
    match_distance_m: 0.75

    # Set these to the camera's calibrated intrinsic values, in pixels.
    fx: 1396.808667
    fy: 1396.808667
    cx: 960.0
    cy: 540.0
    # Pole length in meters (red and white are both 0.9 m). Depth is estimated
    # from the bounding-box diagonal and corrected using the camera and drone
    # orientations.
    object_height: 0.938

    # Detections are published in the camera frame with the image stamp;
    # landmark_server transforms them with the pose at that time. camera_frame
    # is used when the detections have no frame_id.
    camera_frame: "nautilus/front_camera_color_optical"
    odom_frame: "nautilus/odom"
    tf_timeout_s: 0.1
