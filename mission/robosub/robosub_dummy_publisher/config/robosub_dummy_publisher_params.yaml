/**:
  ros__parameters:
    # Empty string = fresh random draw each run (printed to the log so you can
    # reproduce it). Pass the same value as vortex-stonefish-sim's
    # robosub_icon_seed to make role-dependent landmarks (gate, bin) agree
    # with what the sim actually rendered.
    seed: ""

    # Which course elements to publish dummy landmarks for.
    tasks: ["gate", "slalom", "torpedo_board", "bin"]

    # Detectors run at 10 Hz or more. landmark_server confirms a track after
    # 3 hits in 5 ticks of 200 ms, so a slower publisher never shows up in the map.
    rate: 10.0

    # Must be resolvable (directly, or via tf) to landmark_server's
    # target_frame. The default is landmark_server's target_frame, so no tf is
    # needed; the positions are then odom positions (the simulator's world).
    frame_id: "nautilus/odom"

    # Metres of Gaussian jitter added to every publish, to emulate an
    # imperfect detector. 0.0 = perfect, noiseless ground truth.
    position_noise_std: 0.0

    topic: "landmarks"

    # Publish only what the cameras could see from the vehicle pose on
    # odom_topic (front: range and half field of view; down: radius below the
    # vehicle). Positions are then assumed to be in the frame of that odom.
    use_field_of_view: false
    odom_topic: "odom"
    front_range_m: 8.0
    front_half_fov_deg: 45.0
    down_radius_m: 1.5
    down_max_altitude_m: 3.0

    # Unstable detections, to test the robustness of the map. All off here;
    # launch with profile:=unstable for config/robosub_dummy_publisher_unstable.yaml.
    detection_probability: 1.0     # per landmark and frame
    frame_drop_probability: 0.0    # the whole message is lost
    dropout_rate_per_sec: 0.0      # new occlusions per landmark [1/s]
    dropout_duration_sec: [1.0, 5.0]
    outlier_probability: 0.0       # detection far off (std outlier_std_m)
    outlier_std_m: 1.0
    false_positive_rate: 0.0       # spurious detections per frame (expected)
    false_positive_radius_m: 2.0   # ... within this radius of a real landmark
    noise_seed: -1                 # -1 = a fresh draw each run
