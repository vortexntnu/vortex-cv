# 4 waypoints for the learning_period onboarding mission.
#
# Consumed by vortex::utils::waypoints::load_waypoint_goal_from_yaml() (see
# vortex_utils/include/vortex/utils/waypoint_utils.hpp) — one WaypointGoal
# struct per top-level key. Loaded in src/blackboard.cpp and handed to
# vortex_yasmin_utils::WaypointGoalState instances in
# src/build_state_machine.cpp.
#
# Units: roll/pitch/yaw are in DEGREES. The loader (load_pose_for_mode in
# waypoint_utils.cpp) multiplies each by pi/180 before converting to a
# quaternion, so put plain degrees here — do not pre-convert to radians.
#
# Frame: {namespace}/odom, NED convention — x = North, y = East, z = Down.
# Depth is therefore POSITIVE z. Yaw is measured from North (x) toward
# East (y). WaypointManager goals carry an unstamped geometry_msgs/Pose
# (no frame_id); every other FSM in this repo sends goals in the odom frame
# by convention. See README "Open questions" if this needs confirming
# against the actual sim/robot setup.
#
# The 4 poses below form a flat 3x3 m square patrol loop at 2.0 m depth,
# turning 90 degrees at each corner. Adjust if this doesn't fit your sim
# world's spawn point / bounds.

waypoint_1:
  mode: full_pose
  position:
    x: 3.0
    y: 0.0
    z: 2.0
  orientation:
    roll: 0.0
    pitch: 0.0
    yaw: 0.0 # facing North (+x)
  convergence_threshold: 0.3

waypoint_2:
  mode: full_pose
  position:
    x: 3.0
    y: 3.0
    z: 2.0
  orientation:
    roll: 0.0
    pitch: 0.0
    yaw: 90.0 # facing East (+y)
  convergence_threshold: 0.3

waypoint_3:
  mode: full_pose
  position:
    x: 0.0
    y: 3.0
    z: 2.0
  orientation:
    roll: 0.0
    pitch: 0.0
    yaw: 180.0 # facing South (-x)
  convergence_threshold: 0.3

waypoint_4:
  mode: full_pose
  position:
    x: 0.0
    y: 0.0
    z: 2.0
  orientation:
    roll: 0.0
    pitch: 0.0
    yaw: -90.0 # facing West (-y)
  convergence_threshold: 0.3
